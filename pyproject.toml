[tool.poetry]
name = "forecast-bench"
version = "0.2.0"
description = "An honestly-reported forecasting benchmark: classical statistical models vs. a fine-tuned time-series foundation model, on real financial data, with a leakage-safe backtest."
authors = ["Rohan Jain <rohanjain2312@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Rohanjain2312/forecast_bench"
repository = "https://github.com/Rohanjain2312/forecast_bench"
packages = [{ include = "forecast_bench" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = ">=2.2"
pyarrow = ">=15.0"
numpy = ">=1.26"
scipy = ">=1.11"
statsmodels = ">=0.14"
darts = ">=0.30"
# darts' torch models (N-BEATS, RNNModel) need Lightning; without it darts raises
# "The (Py)Torch module could not be imported" even when torch itself is present.
pytorch-lightning = ">=2.3"
chronos-forecasting = ">=1.4"
# peft is needed to *load* the fine-tuned LoRA adapters, not just to train them, so
# it is a runtime dependency of the local benchmark rather than Colab-only.
peft = ">=0.11"
fredapi = ">=0.5"
yfinance = ">=0.2.40"
huggingface-hub = ">=0.24"
datasets = ">=2.20"
pydantic-settings = ">=2.3"
python-dotenv = ">=1.0"
pyyaml = ">=6.0"
matplotlib = ">=3.8"
plotly = ">=5.22"
arch = ">=7.0"
tqdm = ">=4.66"
# pandas.to_markdown() needs it; the results doc is generated, not hand-written.
tabulate = ">=0.9"
wandb = ">=0.17"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-cov = ">=5.0"
pytest-mock = ">=3.14"
black = ">=24.4"
isort = ">=5.13"
ruff = ">=0.5"
pre-commit = ">=3.7"

# GPU-only extras. Installed on Colab, never on the local Mac.
#   poetry install --with gpu
[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
torch = ">=2.3"
peft = ">=0.11"
transformers = ">=4.42"
accelerate = ">=0.31"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
# Keep isort and ruff's I rules agreeing on where `tests.*` sorts; otherwise each
# reformats what the other just wrote.
known_first_party = ["forecast_bench", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["forecast_bench", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected by default)",
    "gpu: marks tests as requiring a GPU (deselected by default)",
]
addopts = "-m 'not slow and not gpu'"
