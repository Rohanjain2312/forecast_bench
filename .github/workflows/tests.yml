name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        # The gpu group is deliberately excluded — CI runs on CPU only.
        run: poetry install --no-interaction

      - name: black
        run: poetry run black --check .

      - name: isort
        run: poetry run isort --check-only .

      - name: ruff
        run: poetry run ruff check .

      - name: pytest
        run: poetry run pytest -m "not slow and not gpu"
